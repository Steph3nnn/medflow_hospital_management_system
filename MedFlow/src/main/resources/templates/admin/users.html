<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>User Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container-fluid min-vh-100">

    <div class="row min-vh-100">

        <!-- SIDEBAR -->
        <div class="col-md-2 p-0"
             th:replace="~{fragments/sidebar :: sidebar}">
        </div>


        <!-- MAIN CONTENT -->
        <div class="col-md-10 p-0">

            <!-- NAVBAR -->
            <div th:replace="~{fragments/navbar :: navbar}"></div>


            <form th:action="@{/admin/users}"
                  method="get"
                  class="mb-4">

                <div class="input-group">

                    <input type="text"
                           name="search"
                           class="form-control"
                           placeholder="Search by name or email..."
                           th:value="${search}">

                    <button type="submit"
                            class="btn btn-primary">

                        <i class="bi bi-search"></i>
                        Search

                    </button>

                </div>

            </form>


            <!-- SUCCESS MESSAGE -->
            <div class="p-4 pb-0">

                <div th:if="${success}"
                     class="alert alert-success alert-dismissible fade show"
                     role="alert">

                    <i class="bi bi-check-circle"></i>

                    <span th:text="${success}"></span>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="alert">
                    </button>

                </div>

            </div>


            <!-- PAGE CONTENT -->
            <main class="p-4">

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <h2>User Management</h2>

                    <a class="btn btn-primary"
                       th:href="@{/admin/users/create}">

                        <i class="bi bi-plus-circle"></i>
                        Add User

                    </a>

                </div>


                <!-- USERS TABLE -->
                <div class="card shadow-sm">

                    <div class="card-body">

                        <div class="table-responsive">

                            <table class="table table-striped table-hover mb-0">

                                <thead class="table-dark">

                                <tr>

                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Status</th>
                                    <th>Actions</th>

                                </tr>

                                </thead>


                                <tbody>

                                <tr th:each="user : ${users}">

                                    <td th:text="${user.firstName + ' ' + user.lastName}">
                                    </td>

                                    <td th:text="${user.email}">
                                    </td>

                                    <td th:text="${user.role.name}">
                                    </td>


                                    <td>

                                        <span class="badge bg-success"
                                              th:if="${user.enabled}">
                                            Active
                                        </span>

                                        <span class="badge bg-danger"
                                              th:unless="${user.enabled}">
                                            Disabled
                                        </span>

                                    </td>


                                    <td>

                                        <!-- EDIT -->
                                        <a th:href="@{/admin/users/edit/{id}(id=${user.id})}"
                                           class="btn btn-warning btn-sm">

                                            <i class="bi bi-pencil-square"></i>
                                            Edit

                                        </a>


                                        <!-- DISABLE -->
                                        <form th:if="${user.enabled}"
                                              th:action="@{/admin/users/disable/{id}(id=${user.id})}"
                                              method="post"
                                              class="d-inline">

                                            <button type="submit"
                                                    class="btn btn-danger btn-sm">

                                                <i class="bi bi-person-x"></i>
                                                Disable

                                            </button>

                                        </form>


                                        <!-- ENABLE -->
                                        <form th:unless="${user.enabled}"
                                              th:action="@{/admin/users/enable/{id}(id=${user.id})}"
                                              method="post"
                                              class="d-inline">

                                            <button type="submit"
                                                    class="btn btn-success btn-sm">

                                                <i class="bi bi-person-check"></i>
                                                Enable

                                            </button>

                                        </form>

                                    </td>

                                </tr>

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </main>

        </div>

    </div>

</div>

</body>

</html>
