<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Medflow | View Consultation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container-fluid">

    <div class="row min-vh-100">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div class="col-md-10 p-0">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="p-4">


            <div class="card border-0 shadow-sm rounded-4">

                <div class="card-header bg-white">

                    <h3 class="fw-bold">

                        Consultation Details

                    </h3>

                </div>

                <div class="card-body">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="fw-bold">

                                Consultation ID

                            </label>

                            <p th:text="${consultation.consultationId}"></p>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="fw-bold">

                                Consultation Date

                            </label>

                            <p th:text="${consultation.consultationDate}"></p>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="fw-bold">

                                Patient

                            </label>

                            <p th:text="${consultation.appointment.patient.firstName + ' ' + consultation.appointment.patient.lastName}"></p>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="fw-bold">

                                Doctor

                            </label>

                            <p th:text="${'Dr. ' + consultation.appointment.doctor.firstName + ' ' + consultation.appointment.doctor.lastName}"></p>

                        </div>
                        <div class="col-12 mb-3">

                            <label class="fw-bold">

                                Chief Complaint

                            </label>

                            <p th:text="${consultation.chiefComplaint}"></p>

                        </div>

                        <div class="col-12 mb-3">

                            <label class="fw-bold">

                                History of Present Illness

                            </label>

                            <p th:text="${consultation.historyOfPresentIllness}"></p>

                        </div>

                        <div class="col-12 mb-3">

                            <label class="fw-bold">

                                Physical Examination

                            </label>

                            <p th:text="${consultation.physicalExamination}"></p>

                        </div>

                        <div class="col-12 mb-3">

                            <label class="fw-bold">

                                Diagnosis

                            </label>

                            <p th:text="${consultation.diagnosis}"></p>

                        </div>

                        <div class="col-12 mb-3">

                            <label class="fw-bold">

                                Treatment Plan

                            </label>

                            <p th:text="${consultation.treatmentPlan}"></p>

                        </div>

                        <div class="col-12 mb-4">

                            <label class="fw-bold">

                                Notes

                            </label>

                            <p th:text="${consultation.notes ?: 'No additional notes.'}"></p>

                        </div>

                        <div class="d-flex justify-content-end gap-2">

                            <a th:href="@{/admin/consultations}"
                               class="btn btn-secondary">

                                <i class="bi bi-arrow-left"></i>

                                Back

                            </a>

                            <a th:href="@{/admin/consultations/edit/{id}(id=${consultation.id})}"
                               class="btn btn-warning">

                                <i class="bi bi-pencil-square"></i>

                                Edit

                            </a>

                        </div>

                    </div>

                </div>

            </div>



    </main>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
