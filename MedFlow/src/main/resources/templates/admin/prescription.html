<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Prescription Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container-fluid">

    <div class="row min-vh-100">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>


        <div class="col-md-10 p-0">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="p-4">



            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h2 class="fw-bold">

                        Prescription Management

                    </h2>

                    <p class="text-muted">

                        Manage patient prescriptions

                    </p>

                </div>

                <a th:href="@{/admin/prescription/create}"
                   class="btn btn-primary">

                    <i class="bi bi-plus-circle me-2"></i>

                    New Prescription

                </a>

            </div>

        <form th:action="@{/admin/prescriptions}"
              method="get"
              class="mb-4">

            <div class="input-group">

                <input type="text"
                       name="search"
                       class="form-control"
                       placeholder="Search by Prescription Id..."
                       th:value="${search}">

                <button type="submit"
                        class="btn btn-primary">

                    <i class="bi bi-search"></i>
                    Search

                </button>

            </div>

        </form>

            <div class="card border-0 shadow-sm rounded-4">

                <div class="card-body">

                    <div class="table-responsive">

                        <table class="table table-hover align-middle">

                            <thead class="table-light">

                            <tr>

                                <th>Prescription ID</th>

                                <th>Patient</th>

                                <th>Doctor</th>

                                <th>Medication</th>

                                <th>Dosage</th>

                                <th>Actions</th>

                            </tr>

                            </thead>

                            <tbody>

                            <tr th:each="prescription : ${prescriptions}">

                                <td th:text="${prescription.prescriptionId}"></td>

                                <td th:text="${prescription.consultation.appointment.patient.firstName + ' ' + prescription.consultation.appointment.patient.lastName}"></td>

                                <td th:text="${'Dr. ' + prescription.consultation.appointment.doctor.firstName + ' ' + prescription.consultation.appointment.doctor.lastName}"></td>

                                <td th:text="${prescription.medication}"></td>

                                <td th:text="${prescription.dosage}"></td>

                                <td>

                                    <a class="btn btn-info btn-sm"
                                       th:href="@{/admin/prescription/view/{id}(id=${prescription.id})}">

                                        <i class="bi bi-eye">View</i>

                                    </a>

                                    <a class="btn btn-warning btn-sm"
                                       th:href="@{/admin/prescription/edit/{id}(id=${prescription.id})}">

                                        <i class="bi bi-pencil">Edit</i>

                                    </a>

                                    <form method="post"
                                          style="display:inline;"
                                          th:action="@{/admin/prescription/delete/{id}(id=${prescription.id})}">
                                        <button type="submit"
                                                class="btn btn-danger btn-sm"
                                                onclick="return confirm('Are you sure you want to delete this prescription?')">

                                            <i class="bi bi-trash">Delete</i>

                                        </button>

                                    </form>

                                </td>

                            </tr>

                            <tr th:if="${#lists.isEmpty(prescriptions)}">

                                <td colspan="6"
                                    class="text-center text-muted py-4">

                                    <i class="bi bi-capsule-pill fs-1"></i>

                                    <br><br>

                                    No prescriptions found.

                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

    </main>

</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
