<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Edit Consultation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container-fluid">

    <div class="row min-vh-100">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div class="col-md-10 p-0">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="p-4">


            <div class="card border-0 shadow-sm rounded-4">

                <div class="card-header bg-white">

                    <h3 class="fw-bold">

                        Edit Consultation

                    </h3>

                </div>

                <div class="card-body">

                    <form th:action="@{/admin/consultations/edit/{id}(id=${consultation.id})}"
                          method="post">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Appointment

                                </label>

                                <select class="form-select"
                                        name="appointmentId">

                                    <option
                                            th:each="appointment : ${appointments}"
                                            th:value="${appointment.id}"
                                            th:selected="${appointment.id == consultation.appointment.id}"
                                            th:text="${appointment.patient.firstName + ' ' + appointment.patient.lastName + ' - Dr. ' + appointment.doctor.firstName}">
                                    </option>

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Consultation Date

                                </label>

                                <input type="date"
                                       class="form-control"
                                       name="consultationDate"
                                       th:value="${consultation.consultationDate}">

                            </div>

                        </div>
                        <div class="mb-3">

                            <label class="form-label">

                                Chief Complaint

                            </label>

                            <textarea class="form-control"
                                      rows="3"
                                      name="chiefComplaint"
                                      th:text="${consultation.chiefComplaint}">
    </textarea>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                History of Present Illness

                            </label>

                            <textarea class="form-control"
                                      rows="4"
                                      name="historyOfPresentIllness"
                                      th:text="${consultation.historyOfPresentIllness}">
    </textarea>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Physical Examination

                            </label>

                            <textarea class="form-control"
                                      rows="4"
                                      name="physicalExamination"
                                      th:text="${consultation.physicalExamination}">
    </textarea>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Diagnosis

                            </label>

                            <textarea class="form-control"
                                      rows="3"
                                      name="diagnosis"
                                      th:text="${consultation.diagnosis}">
    </textarea>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Treatment Plan

                            </label>

                            <textarea class="form-control"
                                      rows="4"
                                      name="treatmentPlan"
                                      th:text="${consultation.treatmentPlan}">
    </textarea>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">

                                Notes

                            </label>

                            <textarea class="form-control"
                                      rows="3"
                                      name="notes"
                                      th:text="${consultation.notes}">
    </textarea>

                        </div>

                        <div class="d-flex justify-content-end gap-2">

                            <a th:href="@{/admin/consultations}"
                               class="btn btn-secondary">

                                <i class="bi bi-arrow-left"></i>

                                Cancel

                            </a>

                            <button type="submit"
                                    class="btn btn-warning">

                                <i class="bi bi-check-circle"></i>

                                Update Consultation

                            </button>

                        </div>

                    </form>

                </div>

            </div>


    </main>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
