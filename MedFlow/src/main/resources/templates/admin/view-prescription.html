<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>View Prescription</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content">

        <div class="container-fluid">

            <div class="card border-0 shadow-sm rounded-4">

                <div class="card-header bg-white">

                    <h3 class="fw-bold">

                        Prescription Details

                    </h3>

                </div>

                <div class="card-body">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="fw-bold">Prescription ID</label>

                            <p th:text="${prescription.prescriptionId}"></p>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="fw-bold">Consultation ID</label>

                            <p th:text="${prescription.consultation.consultationId}"></p>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="fw-bold">Patient</label>

                            <p th:text="${prescription.consultation.appointment.patient.firstName + ' ' + prescription.consultation.appointment.patient.lastName}"></p>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="fw-bold">Doctor</label>

                            <p th:text="${'Dr. ' + prescription.consultation.appointment.doctor.firstName + ' ' + prescription.consultation.appointment.doctor.lastName}"></p>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="fw-bold">Medication</label>

                            <p th:text="${prescription.medication}"></p>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="fw-bold">Dosage</label>

                            <p th:text="${prescription.dosage}"></p>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="fw-bold">Frequency</label>

                            <p th:text="${prescription.frequency}"></p>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="fw-bold">Duration</label>

                            <p th:text="${prescription.duration}"></p>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="fw-bold">Route</label>

                            <p th:text="${prescription.route}"></p>

                        </div>

                        <div class="col-12 mb-4">

                            <label class="fw-bold">Instructions</label>

                            <p th:text="${prescription.instructions}"></p>

                        </div>

                    </div>

                    <div class="d-flex justify-content-end gap-2">

                        <a th:href="@{/admin/prescriptions}"
                           class="btn btn-secondary">

                            Back

                        </a>

                        <a th:href="@{/admin/prescriptions/edit/{id}(id=${prescription.id})}"
                           class="btn btn-warning">

                            Edit

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
