<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Laboratory Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content">

        <div class="container-fluid">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h2 class="fw-bold">

                        Laboratory Requests

                    </h2>

                    <p class="text-muted">

                        Manage laboratory requests and results

                    </p>

                </div>

                <a th:href="@{/admin/laboratories/create}"
                   class="btn btn-primary">

                    <i class="bi bi-plus-circle me-2"></i>

                    New Request

                </a>

            </div>

            <form method="get"
                  th:action="@{/admin/laboratories}"
                  class="row mb-4">

                <div class="col-md-5">

                    <input type="text"
                           class="form-control"
                           name="keyword"
                           th:value="${keyword}"
                           placeholder="Search Laboratory ID...">

                </div>

                <div class="col-md-2">

                    <button class="btn btn-dark w-100">

                        <i class="bi bi-search"></i>

                        Search

                    </button>

                </div>

            </form>

            <div class="card border-0 shadow-sm rounded-4">

                <div class="card-body">

                    <div class="table-responsive">

                        <table class="table table-hover align-middle">

                            <thead class="table-light">

                            <tr>

                                <th>Lab ID</th>
                                <th>Patient</th>
                                <th>Test</th>
                                <th>Priority</th>
                                <th>Status</th>
                                <th>Actions</th>

                            </tr>

                            </thead>

                            <tbody>

                            <tr th:each="lab : ${laboratories}">

                                <td th:text="${lab.laboratoryId}"></td>

                                <td th:text="${lab.consultation.appointment.patient.firstName + ' ' + lab.consultation.appointment.patient.lastName}"></td>

                                <td th:text="${lab.testName}"></td>

                                <td th:text="${lab.priority}"></td>

                                <td>

                                    <span class="badge bg-warning"
                                          th:if="${lab.status=='Pending'}">

                                        Pending

                                    </span>

                                    <span class="badge bg-success"
                                          th:if="${lab.status=='Completed'}">

                                        Completed

                                    </span>

                                    <span class="badge bg-primary"
                                          th:if="${lab.status=='In Progress'}">

                                        In Progress

                                    </span>

                                </td>

                                <td>

                                    <a class="btn btn-info btn-sm"
                                       th:href="@{/admin/laboratories/view/{id}(id=${lab.id})}">

                                        <i class="bi bi-eye"></i>

                                    </a>

                                    <a class="btn btn-warning btn-sm"
                                       th:href="@{/admin/laboratories/edit/{id}(id=${lab.id})}">

                                        <i class="bi bi-pencil"></i>

                                    </a>

                                    <form method="post"
                                          style="display:inline;"
                                          th:action="@{/admin/laboratories/delete/{id}(id=${lab.id})}">

                                        <button class="btn btn-danger btn-sm"
                                                onclick="return confirm('Delete laboratory request?')">

                                            <i class="bi bi-trash"></i>

                                        </button>

                                    </form>

                                </td>

                            </tr>

                            <tr th:if="${#lists.isEmpty(laboratories)}">

                                <td colspan="6"
                                    class="text-center text-muted py-4">

                                    <i class="bi bi-eyedropper fs-1"></i>

                                    <br><br>

                                    No laboratory requests found.

                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
