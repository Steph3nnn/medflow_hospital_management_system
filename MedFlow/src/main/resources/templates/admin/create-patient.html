<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Register Patient</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container-fluid">

    <div class="row min-vh-100">

        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <!-- Main Content -->
        <div class="col-md-10 p-0">

            <!-- Navbar -->
            <div th:replace="~{fragments/navbar :: navbar}"></div>

            <main class="p-4">

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <h2>Register Patient</h2>

                    <a th:href="@{/admin/patients}"
                       class="btn btn-secondary">

                        <i class="bi bi-arrow-left"></i>
                        Back

                    </a>

                </div>

                <form th:action="@{/admin/patients/create}"
                      th:object="${patient}"
                      method="post">

                    <!-- PERSONAL INFORMATION -->

                    <div class="card shadow-sm mb-4">

                        <div class="card-header">

                            <h5 class="mb-0">
                                Personal Information
                            </h5>

                        </div>

                        <div class="card-body">

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        First Name
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{firstName}">

                                    <div class="text-danger"
                                         th:errors="*{firstName}">
                                    </div>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Last Name
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{lastName}">

                                    <div class="text-danger"
                                         th:errors="*{lastName}">
                                    </div>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Gender
                                    </label>

                                    <select class="form-select"
                                            th:field="*{gender}">

                                        <option value="">
                                            Select Gender
                                        </option>

                                        <option th:each="gender : ${genders}"
                                                th:value="${gender}"
                                                th:text="${gender}">
                                        </option>

                                    </select>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Date of Birth
                                    </label>

                                    <input type="date"
                                           class="form-control"
                                           th:field="*{dateOfBirth}">

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Phone Number
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{phoneNumber}">

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Email
                                    </label>

                                    <input type="email"
                                           class="form-control"
                                           th:field="*{email}">

                                </div>

                                <div class="col-12">

                                    <label class="form-label">
                                        Address
                                    </label>

                                    <textarea class="form-control"
                                              rows="3"
                                              th:field="*{address}">
                                    </textarea>

                                </div>

                            </div>

                        </div>

                    </div>
                    <!-- MEDICAL INFORMATION -->

                    <div class="card shadow-sm mb-4">

                        <div class="card-header">

                            <h5 class="mb-0">
                                Medical Information
                            </h5>

                        </div>

                        <div class="card-body">

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Blood Group
                                    </label>

                                    <select class="form-select"
                                            th:field="*{bloodGroup}">

                                        <option value="">
                                            Select Blood Group
                                        </option>

                                        <option th:each="bloodGroup : ${bloodGroups}"
                                                th:value="${bloodGroup}"
                                                th:text="${bloodGroup}">
                                        </option>

                                    </select>

                                    <div class="text-danger"
                                         th:errors="*{bloodGroup}">
                                    </div>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Genotype
                                    </label>

                                    <select class="form-select"
                                            th:field="*{genotype}">

                                        <option value="">
                                            Select Genotype
                                        </option>

                                        <option th:each="genotype : ${genotypes}"
                                                th:value="${genotype}"
                                                th:text="${genotype}">
                                        </option>

                                    </select>

                                    <div class="text-danger"
                                         th:errors="*{genotype}">
                                    </div>

                                </div>

                                <div class="col-12">

                                    <label class="form-label">
                                        Allergies
                                    </label>

                                    <textarea class="form-control"
                                              rows="4"
                                              placeholder="Enter any known allergies"
                                              th:field="*{allergies}">
                                    </textarea>

                                </div>

                            </div>

                        </div>

                    </div>
                    <!-- EMERGENCY CONTACT -->

                    <div class="card shadow-sm mb-4">

                        <div class="card-header">

                            <h5 class="mb-0">
                                Emergency Contact
                            </h5>

                        </div>

                        <div class="card-body">

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Emergency Contact Name
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{emergencyContactName}">

                                    <div class="text-danger"
                                         th:errors="*{emergencyContactName}">
                                    </div>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Emergency Contact Phone
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{emergencyContactPhone}">

                                    <div class="text-danger"
                                         th:errors="*{emergencyContactPhone}">
                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>


                    <!-- ACTION BUTTONS -->

                    <div class="d-flex justify-content-end gap-2">

                        <a th:href="@{/admin/patients}"
                           class="btn btn-secondary">

                            <i class="bi bi-x-circle"></i>

                            Cancel

                        </a>

                        <button type="submit"
                                class="btn btn-primary">

                            <i class="bi bi-floppy"></i>

                            Register Patient

                        </button>

                    </div>

                </form>

            </main>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
