<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Medflow | Create Consultation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container-fluid">

        <div class="row min-vh-100">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

            <div class="col-md-10 p-0">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="p-4">



            <div class="card border-0 shadow-sm rounded-4">

                <div class="card-header bg-white">

                    <h3 class="fw-bold">

                        Create Consultation

                    </h3>

                    <p class="text-muted mb-0">

                        Record a patient's consultation details.

                    </p>

                </div>

                <div class="card-body">

                    <form th:action="@{/admin/consultations/create}"
                          th:object="${createConsultationRequest}"
                          method="post">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Appointment

                                </label>

                                <select class="form-select"
                                        th:field="*{appointmentId}">

                                    <option value="">

                                        Select Appointment

                                    </option>

                                    <option
                                            th:each="appointment : ${appointments}"
                                            th:value="${appointment.id}"
                                            th:text="${appointment.patient.firstName + ' ' + appointment.patient.lastName + ' - Dr. ' + appointment.doctor.firstName}">
                                    </option>

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Consultation Date

                                </label>

                                <input type="date"
                                       class="form-control"
                                       th:field="*{consultationDate}">

                            </div>

                        </div>
                        <div class="mb-3">

                            <label class="form-label">

                                Chief Complaint

                            </label>

                            <textarea class="form-control"
                                      rows="3"
                                      th:field="*{chiefComplaint}"
                                      placeholder="Enter the patient's chief complaint">
</textarea>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                History of Present Illness

                            </label>

                            <textarea class="form-control"
                                      rows="4"
                                      th:field="*{historyOfPresentIllness}"
                                      placeholder="Describe the history of the present illness">
</textarea>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Physical Examination

                            </label>

                            <textarea class="form-control"
                                      rows="4"
                                      th:field="*{physicalExamination}"
                                      placeholder="Enter physical examination findings">
</textarea>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Diagnosis

                            </label>

                            <textarea class="form-control"
                                      rows="3"
                                      th:field="*{diagnosis}"
                                      placeholder="Enter the diagnosis">
</textarea>

                        </div>
                        <div class="mb-3">

                            <label class="form-label">

                                Treatment Plan

                            </label>

                            <textarea class="form-control"
                                      rows="4"
                                      th:field="*{treatmentPlan}"
                                      placeholder="Enter the treatment plan">
</textarea>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">

                                Additional Notes

                            </label>

                            <textarea class="form-control"
                                      rows="3"
                                      th:field="*{notes}"
                                      placeholder="Any additional notes (optional)">
</textarea>

                        </div>

                        <div class="d-flex justify-content-end gap-2">

                            <a th:href="@{/admin/consultations}"
                               class="btn btn-secondary">

                                <i class="bi bi-arrow-left"></i>

                                Cancel

                            </a>

                            <button type="submit"
                                    class="btn btn-primary">

                                <i class="bi bi-check-circle"></i>

                                Save Consultation

                            </button>

                        </div>

                    </form>

                </div>

            </div>



    </main>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
