<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->


        <div th:fragment="sidebar"
             class="col-md-2 bg-dark text-white min-vh-100 p-0">

            <div class="p-3">

                <h4 class="text-center mb-4">
                    MedFlow
                </h4>

                <hr>

                <ul class="nav flex-column">

                    <li class="nav-item mb-2">
                        <a th:href="@{/admin/dashboard}" class="nav-link text-white">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>

                    <li class="nav-item mb-2">
                        <a th:href="@{/admin/users}" class="nav-link text-white">
                            <i class="bi bi-people"></i> User Management
                        </a>
                    </li>

                    <li class="nav-item mb-2">
                        <a th:href="@{/admin/patients}" class="nav-link text-white">
                            <i class="bi bi-person-vcard"></i> Patients
                        </a>
                    </li>

                    <li class="nav-item mb-2">
                        <a th:href="@{/admin/doctors}" class="nav-link text-white">
                            <i class="bi bi-heart-pulse"></i> Doctors
                        </a>
                    </li>

                    <li class="nav-item mb-2">
                        <a th:href="@{/admin/appointments}" class="nav-link text-white">
                            <i class="bi bi-calendar-check"></i> Appointments
                        </a>
                    </li>

                    <li class="nav-item mb-2">
                        <a href="#" class="nav-link text-white">
                            <i class="bi bi-eyedropper"></i> Laboratory
                        </a>
                    </li>

                    <li class="nav-item mb-2">
                        <a href="#" class="nav-link text-white">
                            <i class="bi bi-capsule"></i> Pharmacy
                        </a>
                    </li>

                    <li class="nav-item mb-2">
                        <a href="#" class="nav-link text-white">
                            <i class="bi bi-receipt"></i> Billing
                        </a>
                    </li>

                    <li class="nav-item mb-2">
                        <a href="#" class="nav-link text-white">
                            <i class="bi bi-bar-chart"></i> Reports
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="#" class="nav-link text-white">
                            <i class="bi bi-gear"></i> Settings
                        </a>
                    </li>

                </ul>
            </div>

        </div>

        <!-- Main Content -->

        <div class="col-md-10 p-4">

            <div th:replace="~{fragments/navbar :: navbar}"></div>
            <hr>

            <div class="row">

                <div class="col-md-4">

                    <div class="card shadow-sm">

                        <div class="card-body">

                            <h5>Total Users</h5>

                            <h2><span th:text="${userCount}"></span></h2>

                        </div>

                    </div>

                </div>

                <div class="col-md-4">

                    <div class="card shadow-sm">

                        <div class="card-body">

                            <h5>Total Patients</h5>

                            <h2><span th:text="${patientCount}"></span></h2>

                        </div>

                    </div>

                </div>

                <div class="col-md-4">

                    <div class="card shadow-sm">

                        <div class="card-body">

                            <h5>Doctors</h5>

                            <h2><span th:text="${patientCount}"></span></h2>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
