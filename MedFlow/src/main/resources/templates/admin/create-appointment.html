<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Schedule Appointment</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container-fluid">

    <div class="row min-vh-100">

        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div class="col-md-10 p-0">

            <div th:replace="~{fragments/navbar :: navbar}"></div>

            <main class="p-4">

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <h2>Schedule Appointment</h2>

                    <a th:href="@{/admin/appointments}"
                       class="btn btn-secondary">

                        <i class="bi bi-arrow-left"></i>

                        Back

                    </a>

                </div>

                <form th:action="@{/admin/appointments/create}"
                      th:object="${appointment}"
                      method="post">

                    <div class="card shadow-sm mb-4">

                        <div class="card-header">

                            <h5 class="mb-0">

                                Appointment Details

                            </h5>

                        </div>

                        <div class="card-body">

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Patient
                                    </label>

                                    <select class="form-select"
                                            th:field="*{patientId}">

                                        <option value="">
                                            Select Patient
                                        </option>

                                        <option th:each="patient : ${patients}"
                                                th:value="${patient.id}"
                                                th:text="${patient.patientId + ' - ' + patient.firstName + ' ' + patient.lastName}">
                                        </option>

                                    </select>

                                    <div class="text-danger"
                                         th:errors="*{patientId}">
                                    </div>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Doctor
                                    </label>

                                    <select class="form-select"
                                            th:field="*{doctorId}">

                                        <option value="">
                                            Select Doctor
                                        </option>

                                        <option th:each="doctor : ${doctors}"
                                                th:value="${doctor.id}"
                                                th:text="${doctor.doctorId + ' - Dr. ' + doctor.firstName + ' ' + doctor.lastName}">
                                        </option>

                                    </select>

                                    <div class="text-danger"
                                         th:errors="*{doctorId}">
                                    </div>

                                </div>
                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Appointment Date
                                    </label>

                                    <input type="date"
                                           class="form-control"
                                           th:field="*{appointmentDate}">

                                    <div class="text-danger"
                                         th:errors="*{appointmentDate}">
                                    </div>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Appointment Time
                                    </label>

                                    <input type="time"
                                           class="form-control"
                                           th:field="*{appointmentTime}">

                                    <div class="text-danger"
                                         th:errors="*{appointmentTime}">
                                    </div>

                                </div>

                                <div class="col-12 mb-3">

                                    <label class="form-label">
                                        Reason for Visit
                                    </label>

                                    <textarea class="form-control"
                                              rows="3"
                                              th:field="*{reason}">
                                    </textarea>

                                    <div class="text-danger"
                                         th:errors="*{reason}">
                                    </div>

                                </div>

                                <div class="col-12 mb-4">

                                    <label class="form-label">
                                        Notes
                                    </label>

                                    <textarea class="form-control"
                                              rows="4"
                                              th:field="*{notes}">
                                    </textarea>

                                </div>

                            </div>

                        </div>

                    </div>

                    <div class="d-flex justify-content-end gap-2">

                        <a th:href="@{/admin/appointments}"
                           class="btn btn-secondary">

                            <i class="bi bi-x-circle"></i>

                            Cancel

                        </a>

                        <button type="submit"
                                class="btn btn-primary">

                            <i class="bi bi-calendar-check"></i>

                            Schedule Appointment

                        </button>

                    </div>

                </form>

            </main>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
