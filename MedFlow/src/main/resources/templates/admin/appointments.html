<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Appointment Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container-fluid">

    <div class="row min-vh-100">

        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div class="col-md-10 p-0">

            <div th:replace="~{fragments/navbar :: navbar}"></div>

            <main class="p-4">

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <h2>Appointment Management</h2>

                    <a th:href="@{/admin/appointments/create}"
                       class="btn btn-primary">

                        <i class="bi bi-plus-circle"></i>

                        Schedule Appointment

                    </a>

                </div>

                <form th:action="@{/admin/appointments}"
                      method="get"
                      class="mb-4">

                    <div class="input-group">

                        <input type="text"
                               class="form-control"
                               name="search"
                               placeholder="Search by Appointment ID, Patient or Doctor..."
                               th:value="${search}">

                        <button class="btn btn-primary">

                            <i class="bi bi-search"></i>

                            Search

                        </button>

                    </div>

                </form>

                <div th:if="${success}"
                     class="alert alert-success alert-dismissible fade show">

                    <span th:text="${success}"></span>

                    <button class="btn-close"
                            data-bs-dismiss="alert">
                    </button>

                </div>

                <div class="card shadow-sm">

                    <div class="card-body">

                        <div class="table-responsive">

                            <table class="table table-hover">

                                <thead class="table-dark">

                                <tr>

                                    <th>Appointment ID</th>

                                    <th>Patient</th>

                                    <th>Doctor</th>

                                    <th>Date</th>

                                    <th>Time</th>

                                    <th>Status</th>

                                    <th>Actions</th>

                                </tr>

                                </thead>

                                <tbody>

                                <tr th:each="appointment : ${appointments}">
                                    <td th:text="${appointment.appointmentId}"></td>

                                    <td th:text="${appointment.patient.firstName + ' ' + appointment.patient.lastName}"></td>

                                    <td th:text="${appointment.doctor.firstName + ' ' + appointment.doctor.lastName}"></td>

                                    <td th:text="${appointment.appointmentDate}"></td>

                                    <td th:text="${appointment.appointmentTime}"></td>

                                    <td>

<span class="badge bg-primary"
      th:if="${appointment.status.name() == 'SCHEDULED'}">
Scheduled
</span>

                                        <span class="badge bg-success"
                                              th:if="${appointment.status.name() == 'COMPLETED'}">
Completed
</span>

                                        <span class="badge bg-danger"
                                              th:if="${appointment.status.name() == 'CANCELLED'}">
Cancelled
</span>

                                        <span class="badge bg-warning text-dark"
                                              th:if="${appointment.status.name() == 'ABSENT'}">
Absent
</span>

                                    </td>

                                    <td>

                                        <a th:href="@{/admin/appointments/{id}(id=${appointment.id})}"
                                           class="btn btn-info btn-sm">

                                            <i class="bi bi-eye"></i>

                                            View

                                        </a>

                                        <a th:href="@{/admin/appointments/edit/{id}(id=${appointment.id})}"
                                           class="btn btn-warning btn-sm">

                                            <i class="bi bi-pencil-square"></i>

                                            Edit

                                        </a>

                                    </td>

                                </tr>

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </main>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
