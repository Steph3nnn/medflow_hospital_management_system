<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

  <title>Medflow | Doctor Management</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container-fluid">

  <div class="row min-vh-100">

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- Main Content -->
    <div class="col-md-10 p-0">

      <div th:replace="~{fragments/navbar :: navbar}"></div>

      <main class="p-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

          <h2>Doctor Management</h2>

          <a th:href="@{/admin/doctors/create}"
             class="btn btn-primary">

            <i class="bi bi-plus-circle"></i>

            Register Doctor

          </a>

        </div>

        <form th:action="@{/admin/doctors}"
              method="get"
              class="mb-4">

          <div class="input-group">

            <input type="text"
                   name="search"
                   class="form-control"
                   placeholder="Search by Doctor ID, Name or Email..."
                   th:value="${search}">

            <button class="btn btn-primary">

              <i class="bi bi-search"></i>

              Search

            </button>

          </div>

        </form>

        <div th:if="${success}"
             class="alert alert-success alert-dismissible fade show">

          <span th:text="${success}"></span>

          <button class="btn-close"
                  data-bs-dismiss="alert">
          </button>

        </div>

        <div class="card shadow-sm">

          <div class="card-body">

            <div class="table-responsive">

              <table class="table table-hover">

                <thead class="table-dark">

                <tr>

                  <th>Doctor ID</th>
                  <th>Name</th>
                  <th>Department</th>
                  <th>Specialty</th>
                  <th>Status</th>
                  <th>Actions</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="doctor : ${doctors}">

                  <td th:text="${doctor.doctorId}"></td>

                  <td th:text="${doctor.firstName + ' ' + doctor.lastName}"></td>

                  <td th:text="${doctor.department}"></td>

                  <td th:text="${doctor.specialty}"></td>

                  <td>

                                        <span class="badge bg-success"
                                              th:if="${doctor.active}">
                                            Active
                                        </span>

                    <span class="badge bg-danger"
                          th:unless="${doctor.active}">
                                            Inactive
                                        </span>

                  </td>

                  <td>

                    <a th:href="@{/admin/doctors/{id}(id=${doctor.id})}"
                       class="btn btn-info btn-sm">
                      View
                    </a>

                    <a th:href="@{/admin/doctors/edit/{id}(id=${doctor.id})}"
                       class="btn btn-warning btn-sm">
                      Edit
                    </a>

                    <form th:if="${doctor.active}"
                          th:action="@{/admin/doctors/deactivate/{id}(id=${doctor.id})}"
                          method="post"
                          class="d-inline">

                      <button class="btn btn-danger btn-sm">
                        Deactivate
                      </button>

                    </form>

                    <form th:unless="${doctor.active}"
                          th:action="@{/admin/doctors/activate/{id}(id=${doctor.id})}"
                          method="post"
                          class="d-inline">

                      <button class="btn btn-success btn-sm">
                        Activate
                      </button>

                    </form>

                  </td>

                </tr>

                </tbody>

              </table>

            </div>

          </div>

        </div>

      </main>

    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
