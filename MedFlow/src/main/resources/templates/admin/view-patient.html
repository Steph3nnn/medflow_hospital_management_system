<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Patient Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container-fluid">

    <div class="row min-vh-100">

        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div class="col-md-10 p-0">

            <div th:replace="~{fragments/navbar :: navbar}"></div>

            <main class="p-4">

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <h2>Patient Profile</h2>

                    <a th:href="@{/admin/patients}"
                       class="btn btn-secondary">

                        <i class="bi bi-arrow-left"></i>

                        Back

                    </a>

                </div>

                <div class="card shadow-sm">

                    <div class="card-body">

                        <div class="row">

                            <div class="col-md-6">

                                <h5>Personal Information</h5>

                                <hr>

                                <p><strong>Patient ID:</strong>
                                    <span th:text="${patient.patientId}"></span>
                                </p>

                                <p><strong>Name:</strong>
                                    <span th:text="${patient.firstName + ' ' + patient.lastName}"></span>
                                </p>

                                <p><strong>Gender:</strong>
                                    <span th:text="${patient.gender}"></span>
                                </p>

                                <p><strong>Date of Birth:</strong>
                                    <span th:text="${patient.dateOfBirth}"></span>
                                </p>

                                <p><strong>Phone:</strong>
                                    <span th:text="${patient.phoneNumber}"></span>
                                </p>

                                <p><strong>Email:</strong>
                                    <span th:text="${patient.email}"></span>
                                </p>

                                <p><strong>Address:</strong>
                                    <span th:text="${patient.address}"></span>
                                </p>

                            </div>

                            <div class="col-md-6">

                                <h5>Medical Information</h5>

                                <hr>

                                <p><strong>Blood Group:</strong>
                                    <span th:text="${patient.bloodGroup}"></span>
                                </p>

                                <p><strong>Genotype:</strong>
                                    <span th:text="${patient.genotype}"></span>
                                </p>

                                <p><strong>Allergies:</strong>
                                    <span th:text="${patient.allergies}"></span>
                                </p>

                                <hr>

                                <h5>Emergency Contact</h5>

                                <p><strong>Name:</strong>
                                    <span th:text="${patient.emergencyContactName}"></span>
                                </p>

                                <p><strong>Phone:</strong>
                                    <span th:text="${patient.emergencyContactPhone}"></span>
                                </p>

                            </div>

                        </div>

                    </div>

                </div>

            </main>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
