<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Bill Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<<div class="container-fluid">

    <div class="row min-vh-100">

        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <!-- Main Content -->
        <div class="col-md-10 p-0">

            <div th:replace="~{fragments/navbar :: navbar}"></div>

            <main class="p-4">


            <div class="card border-0 shadow-sm rounded-4">

                <div class="card-header bg-white">

                    <h3 class="fw-bold">
                        Bill Details
                    </h3>

                </div>

                <div class="card-body">

                    <div class="row">

                        <div class="col-md-6 mb-4">

                            <label class="fw-bold">
                                Bill ID
                            </label>

                            <p th:text="${billing.billId}"></p>

                        </div>

                        <div class="col-md-6 mb-4">

                            <label class="fw-bold">
                                Billing Date
                            </label>

                            <p th:text="${billing.billingDate}"></p>

                        </div>

                        <div class="col-md-6 mb-4">

                            <label class="fw-bold">
                                Patient
                            </label>

                            <p th:text="${billing.appointment.patient.firstName + ' ' + billing.appointment.patient.lastName}">
                            </p>

                        </div>

                        <div class="col-md-6 mb-4">

                            <label class="fw-bold">
                                Appointment
                            </label>

                            <p th:text="${billing.appointment.id}"></p>

                        </div>

                    </div>

                    <hr>

                    <h5 class="fw-bold mb-3">
                        Charges
                    </h5>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <span>Consultation</span>
                            <strong class="float-end">
                                ₦<span th:text="${billing.consultationFee}"></span>
                            </strong>
                        </div>

                        <div class="col-md-6 mb-3">
                            <span>Laboratory</span>
                            <strong class="float-end">
                                ₦<span th:text="${billing.laboratoryFee}"></span>
                            </strong>
                        </div>

                        <div class="col-md-6 mb-3">
                            <span>Medication</span>
                            <strong class="float-end">
                                ₦<span th:text="${billing.medicationFee}"></span>
                            </strong>
                        </div>

                        <div class="col-md-6 mb-3">
                            <span>Other Charges</span>
                            <strong class="float-end">
                                ₦<span th:text="${billing.otherCharges}"></span>
                            </strong>
                        </div>

                    </div>

                    <hr>

                    <div class="row">

                        <div class="col-md-4">

                            <label class="fw-bold">
                                Total
                            </label>

                            <h4>
                                ₦<span th:text="${billing.totalAmount}"></span>
                            </h4>

                        </div>

                        <div class="col-md-4">

                            <label class="fw-bold">
                                Amount Paid
                            </label>

                            <h4>
                                ₦<span th:text="${billing.amountPaid}"></span>
                            </h4>

                        </div>

                        <div class="col-md-4">

                            <label class="fw-bold">
                                Balance
                            </label>

                            <h4>
                                ₦<span th:text="${billing.balance}"></span>
                            </h4>

                        </div>

                    </div>

                    <div class="mt-4">

                        <label class="fw-bold">
                            Payment Status
                        </label>

                        <p>

                            <span class="badge bg-success"
                                  th:if="${billing.paymentStatus == 'PAID'}">
                                Paid
                            </span>

                            <span class="badge bg-warning text-dark"
                                  th:if="${billing.paymentStatus == 'PARTIALLY PAID'}">
                                Partially Paid
                            </span>

                            <span class="badge bg-danger"
                                  th:if="${billing.paymentStatus == 'UNPAID'}">
                                Unpaid
                            </span>

                        </p>

                    </div>

                    <div class="mt-3">

                        <label class="fw-bold">
                            Notes
                        </label>

                        <p th:text="${billing.notes ?: 'No notes'}"></p>

                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">

                        <a th:href="@{/admin/billing}"
                           class="btn btn-secondary">

                            Back

                        </a>

                        <a th:href="@{/admin/billing/edit/{id}(id=${billing.id})}"
                           class="btn btn-warning">

                            <i class="bi bi-pencil"></i>
                            Edit

                        </a>

                    </div>

                </div>

            </div>



    </main>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
