<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>MedFlow | Pharmacy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container-fluid">

    <div class="row min-vh-100">

        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <!-- Main Content -->
        <div class="col-md-10 p-0">

            <div th:replace="~{fragments/navbar :: navbar}"></div>

            <main class="p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h2 class="fw-bold">Pharmacy</h2>

                    <p class="text-muted mb-0">
                        Manage medications and pharmacy stock.
                    </p>

                </div>

                <a th:href="@{/admin/pharmacy/create}"
                   class="btn btn-primary">

                    <i class="bi bi-plus-circle me-2"></i>
                    Add Medication

                </a>

            </div>

                <form th:action="@{/admin/pharmacy}"
                      method="get"
                      class="mb-4">

                    <div class="col-md-2 d-flex gap-2">

                        <button type="submit"
                                class="btn btn-dark flex-grow-1">

                            <i class="bi bi-search"></i>
                            Search

                        </button>

                        <a th:href="@{/admin/pharmacy}"
                           class="btn btn-outline-secondary">

                            <i class="bi bi-x-lg"></i>

                        </a>

                    </div>

                </form>

            <div class="card border-0 shadow-sm rounded-4">

                <div class="card-body">

                    <div class="table-responsive">

                        <table class="table table-hover align-middle">

                            <thead class="table-light">

                            <tr>

                                <th>Code</th>

                                <th>Medication</th>

                                <th>Category</th>

                                <th>Quantity</th>

                                <th>Unit Price</th>

                                <th>Expiry</th>

                                <th>Status</th>

                                <th>Actions</th>

                            </tr>

                            </thead>

                            <tbody>

                            <tr th:each="medication : ${medications}">

                                <td th:text="${medication.medicationCode}">
                                </td>

                                <td class="fw-semibold"
                                    th:text="${medication.medicationName}">
                                </td>

                                <td th:text="${medication.category}">
                                </td>

                                <td th:text="${medication.quantity}">
                                </td>

                                <td>

                                    ₦<span
                                        th:text="${medication.unitPrice}">
                                    </span>

                                </td>

                                <td th:text="${medication.expiryDate}">
                                </td>

                                <td>

                                    <span
                                            th:if="${medication.expired}"
                                            class="badge bg-danger">

                                        EXPIRED

                                    </span>

                                    <span
                                            th:if="${!medication.expired && medication.stockStatus == 'OUT OF STOCK'}"
                                            class="badge bg-danger">

                                        OUT OF STOCK

                                    </span>

                                    <span
                                            th:if="${!medication.expired && medication.stockStatus == 'LOW STOCK'}"
                                            class="badge bg-warning text-dark">

                                        LOW STOCK

                                    </span>

                                    <span
                                            th:if="${!medication.expired && medication.stockStatus == 'IN STOCK'}"
                                            class="badge bg-success">

                                        IN STOCK

                                    </span>

                                </td>

                                <td>

                                    <a th:href="@{/admin/pharmacy/view/{id}(id=${medication.id})}"
                                       class="btn btn-info btn-sm">

                                        <i class="bi bi-eye"></i>

                                    </a>

                                    <a th:href="@{/admin/pharmacy/edit/{id}(id=${medication.id})}"
                                       class="btn btn-warning btn-sm">

                                        <i class="bi bi-pencil"></i>

                                    </a>

                                    <form method="post"
                                          style="display:inline;"
                                          th:action="@{/admin/pharmacy/delete/{id}(id=${medication.id})}">

                                        <button type="submit"
                                                class="btn btn-danger btn-sm"
                                                onclick="return confirm('Delete this medication?')">

                                            <i class="bi bi-trash"></i>

                                        </button>

                                    </form>

                                </td>

                            </tr>

                            <tr th:if="${#lists.isEmpty(medications)}">

                                <td colspan="8"
                                    class="text-center text-muted py-5">

                                    <i class="bi bi-capsule fs-1"></i>

                                    <div class="mt-3">
                                        No medications found.
                                    </div>

                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>



    </main>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
