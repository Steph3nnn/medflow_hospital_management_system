<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Billing Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container-fluid">

    <div class="row min-vh-100">

        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <!-- Main Content -->
        <div class="col-md-10 p-0">

            <div th:replace="~{fragments/navbar :: navbar}"></div>

            <main class="p-4">


            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>
                    <h2 class="fw-bold">Billing</h2>
                    <p class="text-muted mb-0">
                        Manage patient bills and payments.
                    </p>
                </div>

                <a th:href="@{/admin/billing/create}"
                   class="btn btn-primary">

                    <i class="bi bi-plus-circle me-2"></i>
                    New Bill

                </a>

            </div>

                <form th:action="@{/admin/billing}"
                      method="get"
                      class="mb-4">

                    <div class="input-group">

                        <input type="text"
                               name="search"
                               class="form-control"
                               placeholder="Search Bill ID..."
                               th:value="${search}">

                        <button class="btn btn-primary">

                            <i class="bi bi-search"></i>

                            Search

                        </button>

                    </div>

                </form>

            <div class="card border-0 shadow-sm rounded-4">

                <div class="card-body">

                    <div class="table-responsive">

                        <table class="table table-hover align-middle">

                            <thead class="table-light">

                            <tr>
                                <th>Bill ID</th>
                                <th>Patient</th>
                                <th>Total</th>
                                <th>Paid</th>
                                <th>Balance</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>

                            </thead>

                            <tbody>

                            <tr th:each="bill : ${billings}">

                                <td th:text="${bill.billId}"></td>

                                <td th:text="${bill.appointment.patient.firstName + ' ' + bill.appointment.patient.lastName}">
                                </td>

                                <td>
                                    ₦<span th:text="${bill.totalAmount}"></span>
                                </td>

                                <td>
                                    ₦<span th:text="${bill.amountPaid}"></span>
                                </td>

                                <td>
                                    ₦<span th:text="${bill.balance}"></span>
                                </td>

                                <td>

                                    <span class="badge bg-success"
                                          th:if="${bill.paymentStatus == 'PAID'}">
                                        Paid
                                    </span>

                                    <span class="badge bg-warning text-dark"
                                          th:if="${bill.paymentStatus == 'PARTIALLY PAID'}">
                                        Partially Paid
                                    </span>

                                    <span class="badge bg-danger"
                                          th:if="${bill.paymentStatus == 'UNPAID'}">
                                        Unpaid
                                    </span>

                                </td>

                                <td>

                                    <a class="btn btn-info btn-sm"
                                       th:href="@{/admin/billing/view/{id}(id=${bill.id})}">

                                        <i class="bi bi-eye"></i>

                                    </a>

                                    <a class="btn btn-warning btn-sm"
                                       th:href="@{/admin/billing/edit/{id}(id=${bill.id})}">

                                        <i class="bi bi-pencil"></i>

                                    </a>

                                    <form method="post"
                                          style="display:inline;"
                                          th:action="@{/admin/billing/delete/{id}(id=${bill.id})}">

                                        <button type="submit"
                                                class="btn btn-danger btn-sm"
                                                onclick="return confirm('Delete this bill?')">

                                            <i class="bi bi-trash"></i>

                                        </button>

                                    </form>

                                </td>

                            </tr>

                            <tr th:if="${#lists.isEmpty(billings)}">

                                <td colspan="7"
                                    class="text-center text-muted py-5">

                                    <i class="bi bi-receipt fs-1"></i>

                                    <div class="mt-3">
                                        No bills found.
                                    </div>

                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>


    </main>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
