<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

  <title>Consultations</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container-fluid">

  <div class="row min-vh-100">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="col-md-10 p-0">

      <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main class="p-4">


      <div class="d-flex justify-content-between align-items-center mb-4">


        <div>

          <h2 class="fw-bold">

            Consultation Management

          </h2>

          <p class="text-muted">

            Manage all patient consultations

          </p>

        </div>

        <a th:href="@{/admin/consultations/create}"
           class="btn btn-primary">

          <i class="bi bi-plus-circle me-2"></i>

          New Consultation

        </a>

      </div>

    <form th:action="@{/admin/consultations}"
          method="get"
          class="mb-4">

      <div class="input-group">

        <input type="text"
               name="search"
               class="form-control"
               placeholder="Search by Consultation Id..."
               th:value="${search}">

        <button type="submit"
                class="btn btn-primary">

          <i class="bi bi-search"></i>
          Search

        </button>

      </div>

    </form>

      <div class="card border-0 shadow-sm rounded-4">

        <div class="card-body">

          <div class="table-responsive">

            <table class="table table-hover align-middle">

              <thead class="table-light">

              <tr>

                <th>ID</th>

                <th>Patient</th>

                <th>Doctor</th>

                <th>Date</th>

                <th>Diagnosis</th>

                <th>Actions</th>

              </tr>

              <tbody>
              <tr th:each="consultation : ${consultations}">

                <td th:text="${consultation.consultationId}"></td>

                <td th:text="${consultation.appointment.patient.firstName + ' ' + consultation.appointment.patient.lastName}"></td>

                <td th:text="${'Dr. ' + consultation.appointment.doctor.firstName + ' ' + consultation.appointment.doctor.lastName}"></td>

                <td th:text="${consultation.consultationDate}"></td>

                <td th:text="${consultation.diagnosis}"></td>

                <td>

                  <a th:href="@{/admin/consultations/view/{id}(id=${consultation.id})}"
                     class="btn btn-info btn-sm">

                    <i class="bi bi-eye">View</i>

                  </a>

                  <a th:href="@{/admin/consultations/edit/{id}(id=${consultation.id})}"
                     class="btn btn-warning btn-sm">

                    <i class="bi bi-pencil-square">Edit</i>

                  </a>

                  <form th:action="@{/admin/consultations/delete/{id}(id=${consultation.id})}"
                        method="post"
                        style="display:inline;">

                    <button class="btn btn-danger btn-sm"
                            onclick="return confirm('Delete this consultation?')">

                      <i class="bi bi-trash">Delete</i>

                    </button>

                  </form>

                </td>

              </tr>

              <tr th:if="${#lists.isEmpty(consultations)}">

                <td colspan="6"
                    class="text-center text-muted py-4">

                  <i class="bi bi-clipboard2-x fs-2"></i>

                  <br><br>

                  No consultations found.

                </td>

              </tr>

              </tbody>

            </table>

          </div>

        </div>

      </div>

  </main>
    </div>
  </div>

  </div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
