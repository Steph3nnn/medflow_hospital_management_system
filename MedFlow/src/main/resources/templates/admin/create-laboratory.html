<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Create Laboratory Request</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content">

        <div class="container-fluid">

            <div class="card border-0 shadow-sm rounded-4">

                <div class="card-header bg-white">

                    <h3 class="fw-bold">

                        Create Laboratory Request

                    </h3>

                    <p class="text-muted mb-0">

                        Request a laboratory investigation for a patient.

                    </p>

                </div>

                <div class="card-body">

                    <form th:action="@{/admin/laboratories/create}"
                          th:object="${createLaboratoryRequest}"
                          method="post">

                        <div class="mb-3">

                            <label class="form-label">

                                Consultation

                            </label>

                            <select class="form-select"
                                    th:field="*{consultationId}">

                                <option value="">

                                    Select Consultation

                                </option>

                                <option
                                        th:each="consultation : ${consultations}"
                                        th:value="${consultation.id}"
                                        th:text="${consultation.consultationId + ' - ' + consultation.appointment.patient.firstName + ' ' + consultation.appointment.patient.lastName}">
                                </option>

                            </select>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Test Name

                                </label>

                                <input type="text"
                                       class="form-control"
                                       th:field="*{testName}"
                                       placeholder="e.g. Full Blood Count">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Sample Type

                                </label>

                                <select class="form-select"
                                        th:field="*{sampleType}">

                                    <option value="">Select Sample</option>
                                    <option>Blood</option>
                                    <option>Urine</option>
                                    <option>Stool</option>
                                    <option>Sputum</option>
                                    <option>Saliva</option>
                                    <option>Swab</option>

                                </select>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Priority

                                </label>

                                <select class="form-select"
                                        th:field="*{priority}">

                                    <option value="">Select Priority</option>
                                    <option>Routine</option>
                                    <option>Urgent</option>
                                    <option>Emergency</option>

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Status

                                </label>

                                <select class="form-select"
                                        th:field="*{status}">

                                    <option>Pending</option>
                                    <option>In Progress</option>
                                    <option>Completed</option>

                                </select>

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Clinical Notes

                            </label>

                            <textarea class="form-control"
                                      rows="4"
                                      th:field="*{clinicalNotes}"
                                      placeholder="Reason for the laboratory investigation...">
                            </textarea>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">

                                Result

                            </label>

                            <textarea class="form-control"
                                      rows="5"
                                      th:field="*{result}"
                                      placeholder="Leave blank if results are not yet available.">
                            </textarea>

                        </div>

                        <div class="d-flex justify-content-end gap-2">

                            <a th:href="@{/admin/laboratories}"
                               class="btn btn-secondary">

                                <i class="bi bi-arrow-left"></i>

                                Cancel

                            </a>

                            <button type="submit"
                                    class="btn btn-primary">

                                <i class="bi bi-check-circle"></i>

                                Save Laboratory Request

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
