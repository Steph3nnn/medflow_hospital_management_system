<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Patient Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container-fluid">

    <div class="row min-vh-100">

        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <!-- Main Content -->
        <div class="col-md-10 p-0">

            <div th:replace="~{fragments/navbar :: navbar}"></div>

            <main class="p-4">

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <h2>Patient Management</h2>

                    <a th:href="@{/admin/patients/create}"
                       class="btn btn-primary">

                        <i class="bi bi-plus-circle"></i>

                        Register Patient

                    </a>

                </div>

                <div th:if="${success}"
                     class="alert alert-success alert-dismissible fade show">

                    <span th:text="${success}"></span>

                    <button class="btn-close"
                            data-bs-dismiss="alert">
                    </button>

                </div>

                <form th:action="@{/admin/patients}"
                      method="get"
                      class="mb-4">

                    <div class="input-group">

                        <input type="text"
                               name="search"
                               class="form-control"
                               placeholder="Search by Patient ID, Name or Phone..."
                               th:value="${search}">

                        <button type="submit"
                                class="btn btn-primary">

                            <i class="bi bi-search"></i>

                            Search

                        </button>

                    </div>

                </form>

                <div class="card shadow-sm">

                    <div class="card-body">

                        <div class="table-responsive">

                            <table class="table table-hover">

                                <thead class="table-dark">

                                <tr>

                                    <th>Patient ID</th>
                                    <th>Name</th>
                                    <th>Gender</th>
                                    <th>Phone</th>
                                    <th>Blood Group</th>
                                    <th>Status</th>
                                    <th>Actions</th>

                                </tr>

                                </thead>

                                <tbody>

                                <tr th:each="patient : ${patients}">

                                    <td th:text="${patient.patientId}"></td>

                                    <td th:text="${patient.firstName + ' ' + patient.lastName}"></td>

                                    <td th:text="${patient.gender}"></td>

                                    <td th:text="${patient.phoneNumber}"></td>

                                    <td th:text="${patient.bloodGroup}"></td>

                                    <td>

                                        <span class="badge bg-success"
                                              th:if="${patient.active}">
                                            Active
                                        </span>

                                        <span class="badge bg-danger"
                                              th:unless="${patient.active}">
                                            Inactive
                                        </span>

                                    </td>

                                    <td>

                                        <a th:href="@{/admin/patients/edit/{id}(id=${patient.id})}"
                                           class="btn btn-warning btn-sm">

                                            <i class="bi bi-pencil-square"></i>

                                            Edit

                                        </a>

                                    </td>

                                </tr>

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </main>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
