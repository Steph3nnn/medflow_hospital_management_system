<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>MedFlow | Medication Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">
<div class="container-fluid">

    <div class="row min-vh-100">

        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <!-- Main Content -->
        <div class="col-md-10 p-0">

            <div th:replace="~{fragments/navbar :: navbar}"></div>

            <main class="p-4">

            <div class="card border-0 shadow-sm rounded-4">

                <div class="card-header bg-white">

                    <h3 class="fw-bold">
                        Medication Details
                    </h3>

                </div>

                <div class="card-body">

                    <div class="row">

                        <div class="col-md-6 mb-4">

                            <label class="fw-bold">
                                Medication Code
                            </label>

                            <p th:text="${pharmacy.medicationCode}">
                            </p>

                        </div>

                        <div class="col-md-6 mb-4">

                            <label class="fw-bold">
                                Medication Name
                            </label>

                            <p th:text="${pharmacy.medicationName}">
                            </p>

                        </div>

                        <div class="col-md-6 mb-4">

                            <label class="fw-bold">
                                Category
                            </label>

                            <p th:text="${pharmacy.category}">
                            </p>

                        </div>

                        <div class="col-md-6 mb-4">

                            <label class="fw-bold">
                                Supplier
                            </label>

                            <p th:text="${pharmacy.supplier}">
                            </p>

                        </div>

                        <div class="col-md-4 mb-4">

                            <label class="fw-bold">
                                Quantity
                            </label>

                            <p th:text="${pharmacy.quantity}">
                            </p>

                        </div>

                        <div class="col-md-4 mb-4">

                            <label class="fw-bold">
                                Unit Price
                            </label>

                            <p>
                                ₦<span th:text="${pharmacy.unitPrice}">
                                </span>
                            </p>

                        </div>

                        <div class="col-md-4 mb-4">

                            <label class="fw-bold">
                                Expiry Date
                            </label>

                            <p th:text="${pharmacy.expiryDate}">
                            </p>

                        </div>

                        <div class="col-md-6 mb-4">

                            <label class="fw-bold">
                                Stock Status
                            </label>

                            <p>

                                <span
                                        th:if="${pharmacy.expired}"
                                        class="badge bg-danger">

                                    EXPIRED

                                </span>

                                <span
                                        th:if="${!pharmacy.expired && pharmacy.stockStatus == 'OUT OF STOCK'}"
                                        class="badge bg-danger">

                                    OUT OF STOCK

                                </span>

                                <span
                                        th:if="${!pharmacy.expired && pharmacy.stockStatus == 'LOW STOCK'}"
                                        class="badge bg-warning text-dark">

                                    LOW STOCK

                                </span>

                                <span
                                        th:if="${!pharmacy.expired && pharmacy.stockStatus == 'IN STOCK'}"
                                        class="badge bg-success">

                                    IN STOCK

                                </span>

                            </p>

                        </div>

                        <div class="col-12 mb-4">

                            <label class="fw-bold">
                                Description
                            </label>

                            <p th:text="${pharmacy.description ?: 'No description provided.'}">
                            </p>

                        </div>

                    </div>

                    <div class="d-flex justify-content-end gap-2">

                        <a th:href="@{/admin/pharmacy}"
                           class="btn btn-secondary">

                            <i class="bi bi-arrow-left"></i>
                            Back

                        </a>

                        <a th:href="@{/admin/pharmacy/edit/{id}(id=${pharmacy.id})}"
                           class="btn btn-warning">

                            <i class="bi bi-pencil"></i>
                            Edit

                        </a>

                    </div>

                </div>

            </div>



    </main>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
