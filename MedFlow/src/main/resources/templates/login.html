<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MedFlow | Login</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/login.css}">

</head>

<body>

<div class="container-fluid">

    <div class="row vh-100">

        <!-- Left Panel -->

        <div class="col-lg-6 d-none d-lg-flex left-panel">

            <div class="overlay">

                <div>

                    <i class="bi bi-hospital logo-icon"></i>

                    <h1 class="display-4 fw-bold mt-3">

                        MedFlow

                    </h1>

                    <p class="lead mt-3">

                        Smart Hospital Management System

                    </p>

                    <hr>

                    <div class="features">

                        <p>

                            <i class="bi bi-check-circle-fill"></i>

                            Patient Management

                        </p>

                        <p>

                            <i class="bi bi-check-circle-fill"></i>

                            Doctor Management

                        </p>

                        <p>

                            <i class="bi bi-check-circle-fill"></i>

                            Appointment Scheduling

                        </p>

                        <p>

                            <i class="bi bi-check-circle-fill"></i>

                            Electronic Medical Records

                        </p>

                    </div>

                </div>

            </div>

        </div>

        <!-- Right Panel -->

        <div class="col-lg-6 d-flex align-items-center justify-content-center">

            <div class="login-card">

                <div class="text-center mb-4">

                    <i class="bi bi-hospital-fill login-icon"></i>

                    <h2 class="mt-3">

                        Welcome Back

                    </h2>

                    <p class="text-muted">

                        Sign in to continue to MedFlow

                    </p>

                </div>

                <form th:action="@{/login}"
                      method="post">
                    <div th:if="${param.error}"
                         class="alert alert-danger">

                        <i class="bi bi-exclamation-circle-fill"></i>

                        Invalid email or password.

                    </div>

                    <div th:if="${param.logout}"
                         class="alert alert-success">

                        <i class="bi bi-check-circle-fill"></i>

                        You have been logged out successfully.

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Email Address

                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-envelope-fill"></i>

                            </span>

                            <input type="email"
                                   name="username"
                                   class="form-control"
                                   placeholder="Enter your email"
                                   required>

                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Password

                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-lock-fill"></i>

                            </span>

                            <input type="password"
                                   id="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="Enter your password"
                                   required>

                            <button type="button"
                                    class="btn btn-outline-secondary"
                                    id="togglePassword">

                                <i class="bi bi-eye-fill"></i>

                            </button>

                        </div>

                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">

                        <div class="form-check">

                            <input class="form-check-input"
                                   type="checkbox"
                                   id="rememberMe">

                            <label class="form-check-label"
                                   for="rememberMe">

                                Remember Me

                            </label>

                        </div>

                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100 login-btn">

                        <i class="bi bi-box-arrow-in-right"></i>

                        Login

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script th:src="@{/js/login.js}"></script>

</body>

</html>
